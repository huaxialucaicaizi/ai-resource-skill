name: Link check

on:
  schedule:
    # Weekly: Monday 03:17 UTC
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run link checker
        id: check
        run: python scripts/check_links.py
        # Soft-fail: script exits 0 after writing the report even if some URLs
        # are dead or blocked. 403/429 on x.com / 小红书 / 抖音 → 需人工确认.

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: |
            reports/link-check-latest.md
            reports/link-check-*.json
          if-no-files-found: warn

      - name: Open or update tracking issue when dead links exist
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/link-check-latest.md';
            if (!fs.existsSync(path)) {
              core.warning('No link-check report found');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const deadMatch = body.match(/- dead: (\d+)/);
            const dead = deadMatch ? Number(deadMatch[1]) : 0;
            const title = '[link-check] Weekly URL health report';
            const issueBody = [
              'Automated weekly link check (soft-fail).',
              '',
              '403/429 on x.com / xiaohongshu / douyin are treated as **需人工确认**, not dead.',
              '',
              body,
              '',
              '_Generated by `.github/workflows/link-check.yml`. No secrets required._',
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 50,
            });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: issueBody,
              });
              core.info(`Commented on issue #${existing.number}`);
            } else if (dead > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: issueBody,
              });
              core.info('Opened new link-check issue');
            } else {
              core.info('No dead links; skipped opening issue (job summary still has the report)');
            }
